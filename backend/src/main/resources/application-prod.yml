server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: never
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

jwt:
  # Supply a cryptographically random value from the deployment secret manager; randomness is provisioned externally.
  secret: ${JWT_SECRET}

upiq:
  cors:
    allowed-origins: ${UPIQ_CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: WARN
    com.upiq: INFO
