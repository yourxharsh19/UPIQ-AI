spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  sql:
    init:
      mode: never

jwt:
  # Production must receive its signing key from the deployment environment.
  secret: ${JWT_SECRET}

upiq:
  cors:
    allowed-origins: ${UPIQ_CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: WARN
    com.upiq: INFO
