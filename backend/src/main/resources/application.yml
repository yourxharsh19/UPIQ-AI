spring:
  application:
    name: upiq-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:upiq}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

jwt:
  # Development fallback only. The prod profile requires an externally supplied secret.
  secret: ${JWT_SECRET:local_dev_secret_key_minimum_256_bits_for_upiq_2_0_local_development_only}
  expiration: 86400000 # 24 hours

upiq:
  cors:
    allowed-origins: ${UPIQ_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    rate-limit:
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
      login-attempts: ${AUTH_LOGIN_RATE_LIMIT:10}
      registration-attempts: ${AUTH_REGISTRATION_RATE_LIMIT:5}
  google:
    enabled: ${UPIQ_GOOGLE_ENABLED:false}
    client-id: ${UPIQ_GOOGLE_CLIENT_ID:}
    client-secret: ${UPIQ_GOOGLE_CLIENT_SECRET:}
    frontend-origin: ${UPIQ_FRONTEND_ORIGIN:http://localhost:5173}
    redirect-uri: ${UPIQ_GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
  admin:
    bootstrap:
      enabled: ${UPIQ_ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${UPIQ_ADMIN_EMAIL:}
      password: ${UPIQ_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    com.upiq: DEBUG
    org.springframework.security: INFO

# EXPERIMENTAL research dataset. Never enable this against the production Neon database.
# Seeding is also gated on Spring profile "research" (see application-research.yml).
research:
  seeding:
    enabled: false
    require-research-profile: true
    user-password: ${RESEARCH_SEEDING_USER_PASSWORD:}
    blocked-datasource-substrings:
      - neon.tech
      - neon.database
      - upiq-prod

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:}
  temperature: ${OLLAMA_TEMPERATURE:0.0}
  timeout: ${OLLAMA_TIMEOUT:60s}
